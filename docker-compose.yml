services:
  slidecraft:
    build: .
    ports:
      - "8787:8787"
    environment:
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      AUTH_MODE: ${AUTH_MODE:-off}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - slidecraft-data:/data
    restart: unless-stopped
volumes:
  slidecraft-data:
