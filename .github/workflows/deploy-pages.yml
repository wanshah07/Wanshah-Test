name: Deploy to GitHub Pages

# Publishes the retirement redirect in retired/ to GitHub Pages at
# https://wanshah07.github.io/Wanshah-Test/
#
# The redirect uses an absolute address, so it works from any path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one midway: a half-finished
# deploy would leave the live site in an undefined state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RETIRED 23 Sep 2026. This landing page was merged into
      # wanshah07/malaysian-regulatory-affairs (site/), which publishes the
      # one consultancy page at https://wanshah07.github.io/kkm-halal/.
      #
      # What is published here now is retired/ only: a redirect to that
      # page, served as index.html and as 404.html so every old path lands
      # there too. The React app in src/ is kept for its history and is not
      # built. To bring it back, restore the npm ci / npm run build steps
      # from git history and upload dist/ again.
      #
      # No actions/configure-pages step, deliberately: Pages is already
      # switched on (Settings > Pages > Source: GitHub Actions), and the
      # built-in GITHUB_TOKEN cannot create a Pages site anyway.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: retired

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
